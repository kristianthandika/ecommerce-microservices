name: ecommerce-microservices

# Semua service backend HANYA di network internal. Hanya gateway & frontend
# yang expose port ke host. URL antar-service di-override ke hostname internal
# Docker (Konvensi Konfigurasi Antar-Service).

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 8s

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      - PORT=3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@inixindo.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
    volumes:
      - auth-keys:/app/services/auth-service/keys # persist RSA keypair (m1.3)
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *healthcheck-defaults
    networks: [internal]

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    environment:
      - PORT=3002
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CORS_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *healthcheck-defaults
    networks: [internal]

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      - PORT=3003
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - CORS_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *healthcheck-defaults
    networks: [internal]

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - CORS_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      # Liveness gateway sendiri (GET /), BUKAN /health agregat (yang 503 kalau
      # ada downstream down) supaya status gateway mencerminkan gateway saja.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *healthcheck-defaults
    ports:
      - '8080:8080'
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # URL yang diakses BROWSER user (host), bukan alamat internal Docker.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (bukan localhost) — nginx listen IPv4; BusyBox wget ke
      # localhost bisa mencoba ::1 (IPv6) → connection refused.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      <<: *healthcheck-defaults
    ports:
      - '3000:80'
    networks: [internal]

volumes:
  auth-keys:

networks:
  internal:
    driver: bridge
