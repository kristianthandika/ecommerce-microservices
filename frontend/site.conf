    server_name _;
    # Jangan umumkan versi nginx di header `Server` / halaman error.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # DNS internal Docker. Dipasangkan dengan VARIABEL di proxy_pass, nginx
    # me-resolve ulang `gateway` tiap TTL habis. Tanpa ini nginx mengunci IP
    # gateway sejak start: begitu container gateway dibuat ulang dengan IP lain,
    # semua /api/ menjadi 502 sampai nginx ikut di-restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway_upstream http://gateway:8080;
        # proxy_pass ber-variabel tidak memotong prefix sendiri → potong di sini.
        # Query string ikut diteruskan otomatis.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Di-OVERWRITE (bukan ditambahkan) supaya XFF kiriman klien tidak dipercaya.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 100k;
    }
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # Security headers apply to the browser-facing origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Aset ber-hash → cache lama. Pakai `expires` (bukan add_header) supaya
    # security header di atas tetap diwariskan ke lokasi ini.
    location /assets/ {
        expires 1y;
    }

    # SPA fallback: refresh di route React Router (mis. /dashboard) TIDAK boleh
    # menghasilkan 404 — semua path yang bukan file nyata diarahkan ke index.html.
    # index.html SELALU divalidasi ulang (no-cache): kalau ikut di-cache lama,
    # browser tetap memuat bundle versi lama setelah deploy baru.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
