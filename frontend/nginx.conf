server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aset ber-hash → cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: refresh di route React Router (mis. /dashboard) TIDAK boleh
    # menghasilkan 404 — semua path yang bukan file nyata diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
