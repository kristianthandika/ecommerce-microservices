server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security header dasar untuk static site. (CSP sengaja tidak diset di sini
    # karena bergantung origin gateway per-deployment — set saat production.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aset ber-hash → cache lama. Pakai `expires` (bukan add_header) supaya
    # security header di atas tetap diwariskan ke lokasi ini.
    location /assets/ {
        expires 1y;
    }

    # SPA fallback: refresh di route React Router (mis. /dashboard) TIDAK boleh
    # menghasilkan 404 — semua path yang bukan file nyata diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
