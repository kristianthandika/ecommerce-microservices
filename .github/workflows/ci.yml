name: Verify services and Docker integration
on: [push, pull_request]
# Action di-pin ke commit SHA (tag bisa dipindahkan pemilik repo action); komentar di
# sampingnya menyebut rilisnya. Perbarui keduanya bersama saat menaikkan versi.
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run openapi:check
      - run: npm test
      - run: npm audit --audit-level=moderate
  integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # The E2E suite validates live responses against the OpenAPI schemas (zod).
      - run: npm ci
      - run: node scripts/setup.mjs --demo-admin
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: node scripts/e2e.mjs --chaos
      - run: node scripts/e2e-shopping.mjs --chaos
      - if: always()
        run: mkdir -p .e2e && docker compose logs --no-color > .e2e/containers.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-results
          path: .e2e/
          include-hidden-files: true
      - if: always()
        run: docker compose down
